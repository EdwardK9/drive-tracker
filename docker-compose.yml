version: '3.8'

services:
  drive-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drive-tracker
    restart: unless-stopped
    ports:
      - "3101:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
    volumes:
      - drive_tracker_data:/app/data
      - drive_tracker_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  drive_tracker_data:
    name: drive_tracker_data
  drive_tracker_uploads:
    name: drive_tracker_uploads
